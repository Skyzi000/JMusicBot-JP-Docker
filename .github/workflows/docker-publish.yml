name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  # schedule:
  #   - cron: '15 4 * * *'
  push:
    branches: [ main, develop ]
    paths-ignore:
      - "**.md"
    # Publish timestamp-suffixed release tags.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - "**.md"

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: JMusicBot-JP
  DOCKERHUB_USERNAME: skyzi000


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up Docker Buildx for cache support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Login to registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker metadata tags
        id: prepare-tags
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            ref_name="${GITHUB_REF_NAME}"
            if [[ ! "$ref_name" =~ ^v(.+)-([0-9]{14})$ ]]; then
              echo "サポートされていないリリースタグ形式です: $ref_name" >&2
              exit 1
            fi

            source_version="${BASH_REMATCH[1]}"
            release_timestamp="${BASH_REMATCH[2]}"
            current_version="$(grep '^ARG JMUSICBOT_VERSION=' Dockerfile | head -n 1 | cut -d'=' -f2)"
            if [[ "$source_version" != "$current_version" ]]; then
              echo "タグの元バージョン ($source_version) と Dockerfile の JMUSICBOT_VERSION ($current_version) が一致しません。" >&2
              exit 1
            fi

            metadata_tags=(
              "type=raw,value=${source_version}-${release_timestamp}"
              "type=raw,value=${source_version}"
              "type=raw,value=beta"
            )

            if [[ "$source_version" != *-* ]]; then
              if [[ ! "$source_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "正式版として解釈できないバージョンです: $source_version" >&2
                exit 1
              fi

              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              metadata_tags+=(
                "type=raw,value=${major}.${minor}"
                "type=raw,value=${major}"
                "type=raw,value=latest"
              )
            fi
          else
            metadata_tags=(
              "type=schedule,pattern=nightly"
              "type=edge,enable=true,branch=develop"
              "type=edge,enable=true,branch=main"
              "type=ref,event=branch"
              "type=ref,event=pr"
            )
          fi

          {
            echo "metadata_tags<<EOF"
            printf '%s\n' "${metadata_tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          flavor: latest=false
          images: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ github.repository }}
          tags: ${{ steps.prepare-tags.outputs.metadata_tags }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
